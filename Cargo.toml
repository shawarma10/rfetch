[package]
name = "rfetch-cli"
version = "1.6.2"
edition = "2024"
description = "A simple, ergonomic CLI HTTP client - like curl, but with clearer flags and prettier output"
license = "GPL-3.0-or-later"
repository = "https://github.com/shawarma10/rfetch"
readme = "README.md"
keywords = ["http", "cli", "curl", "client", "rest"]
categories = ["command-line-utilities"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
tokio = { version = "1.48.0", features = ["macros"] }
reqwest = "0.12.28"
clap = { version = "4.5.53", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
owo-colors = "4.2.3"